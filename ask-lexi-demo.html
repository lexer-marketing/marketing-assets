<style>
/* Shell: transparent, so the product sits on the page's own background */
:root {
  --teal: #00BEB7; --dark-teal: #087680; --bright-teal: #00E2AA; --navy: #3A405B;
  --p-bg: #F4F4F3; --p-line: #E7E5E4; --p-line-2: #EFEEED; --p-text: #262A30; --p-muted: #737373;
  --p-faint: #A3A3A3; --p-teal: #3E9E95; --p-teal-dk: #2E7F78; --p-navy: #353A50;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; }
body { font-family: 'Rubik', system-ui, sans-serif; color: var(--navy); -webkit-font-smoothing: antialiased; }

.lf { max-width: 1040px; margin: 0 auto; }
.lf-frame { position: relative; width: 100%; aspect-ratio: 1184 / 680; overflow: hidden; border-radius: 14px; background: transparent; isolation: isolate; cursor: pointer; }
.lf-canvas { position: absolute; left: 0; top: 0; width: 1184px; height: 680px; transform-origin: 0 0; }
.lf-cam { position: absolute; left: 0; top: 0; width: 1184px; height: 680px; transform-origin: 0 0; }

.pw { position: absolute; left: 0; top: 0; width: 1184px; height: 680px; border-radius: 14px; overflow: hidden; background: var(--p-bg); border: 1px solid #E2E0DE; font-family: 'Inter', system-ui, sans-serif; color: var(--p-text); }
.pw-app { position: absolute; inset: 0; display: flex; }

/* Sidebar */
.ps { position: relative; width: 228px; flex-shrink: 0; padding: 18px 14px 14px; display: flex; flex-direction: column; }
.ps-ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.ps-ws-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--p-teal); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ps-ws-ic svg { width: 16px; height: 16px; }
.ps-ws-n { display: block; font-size: 13px; font-weight: 600; line-height: 1.25; }
.ps-ws-h { display: block; font-size: 11px; color: var(--p-muted); line-height: 1.3; }
.ps-ws > svg { margin-left: auto; width: 15px; height: 15px; color: var(--p-muted); }
.ps-nav { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }
.ps-link { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--p-text); }
.ps-link svg { width: 17px; height: 17px; color: #525252; flex-shrink: 0; }
.ps-link.active { background: #E9E9E7; }
.ps-new-ic { width: 20px; height: 20px; border-radius: 50%; background: var(--p-teal); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ps-new-ic svg { width: 12px; height: 12px; color: #fff !important; stroke-width: 2.6; }
.ps-cap { font-size: 11.5px; font-weight: 500; color: var(--p-muted); margin: 22px 8px 8px; }
.ps-item { font-size: 13px; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 6px; }
.ps-item.cur { background: #E9E9E7; }
.ps-recent { margin-top: auto; }
.ps-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px 2px; }
.ps-av { width: 28px; height: 28px; border-radius: 7px; background: #E6E6E4; font-size: 11.5px; font-weight: 600; color: #525252; display: flex; align-items: center; justify-content: center; }
.ps-user span { font-size: 12.5px; }
.ps-user svg { margin-left: auto; width: 15px; height: 15px; color: var(--p-muted); }

/* Main card */
.pm { position: relative; flex: 1; min-width: 0; margin: 8px 8px 8px 0; background: #fff; border: 1px solid var(--p-line); border-radius: 12px; overflow: hidden; }
.pm-top { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--p-line-2); }
.pm-top svg { width: 17px; height: 17px; color: #737373; flex-shrink: 0; }
.pm-div { width: 1px; height: 18px; background: var(--p-line); }
.pm-title { position: relative; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.pm-title b { font-weight: 500; position: absolute; left: 0; top: 0; }
.pv { position: absolute; left: 0; right: 0; top: 46px; bottom: 0; }

/* Chat */
.pc-body { position: absolute; left: 0; right: 0; top: 0; bottom: 112px; overflow: hidden; }
.pc-col { position: absolute; left: 154px; top: 0; width: 640px; padding: 22px 0 18px; }
.pc-hi { position: absolute; left: 0; right: 0; top: 160px; text-align: center; }
.pc-hi .a { font-size: 14px; color: var(--p-muted); display: flex; align-items: center; justify-content: center; gap: 7px; }
.pc-hi .a svg { width: 16px; height: 16px; }
.pc-hi .b { font-size: 22px; font-weight: 600; margin-top: 6px; letter-spacing: -0.01em; }
.pc-user { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.pc-bubble { max-width: 500px; background: #fff; border: 1px solid #E4E4E4; border-radius: 14px; padding: 11px 16px; font-size: 14.5px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
.pc-lexi { display: flex; align-items: center; gap: 8px; height: 24px; margin-bottom: 8px; }
.pc-lexi svg { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.pc-lexi span { font-size: 15px; font-weight: 600; color: var(--p-teal-dk); white-space: nowrap; }

/* Thinking box (live) and the collapsed steps row it becomes */
.th { border: 1px solid #E4E4E4; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.th-h { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--p-teal-dk); }
.th-h i { width: 6px; height: 6px; border-radius: 50%; background: var(--p-teal-dk); }
.th-h .tm { margin-left: auto; letter-spacing: 0; font-size: 12.5px; font-weight: 500; color: var(--p-muted); font-variant-numeric: tabular-nums; }
.th-h svg { width: 14px; height: 14px; color: #737373; }
.th-b { border-top: 1px solid #EFEFEF; padding: 6px 12px 8px; }
.th-s { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: #555; padding: 3px 0; }
.th-s i { width: 7px; height: 7px; border-radius: 50%; background: #34D399; flex-shrink: 0; }
.th-s.cur { color: var(--p-text); font-weight: 600; }
.th-s.cur i { background: #fff; border: 1.5px solid var(--p-text); }
.st-row { display: none; }
.st-row .th-h i { background: #34D399; }

.pc-p { font-size: 14.5px; line-height: 1.55; margin-bottom: 12px; }
.pc-p b { font-weight: 600; }

/* Chart card */
.ck { border: 1px solid #E6E6E6; border-radius: 10px; overflow: hidden; margin-bottom: 12px; background: #fff; }
.ck-h { display: flex; align-items: center; gap: 9px; padding: 10px 12px 0; font-size: 13px; font-weight: 600; }
.ck-h svg { width: 16px; height: 16px; color: #737373; }
.ck-s { padding: 2px 12px 0 37px; font-size: 11.5px; color: var(--p-muted); }
.ck-lg { display: flex; gap: 16px; padding: 8px 12px 0 37px; font-size: 11.5px; color: #555; }
.ck-lg span { display: inline-flex; align-items: center; gap: 6px; }
.ck-lg i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.ck svg.ch { display: block; width: 100%; height: 170px; }
.ch text { font-family: 'Inter', system-ui, sans-serif; }

/* Next steps */
.nx-cap { font-size: 14px; font-weight: 600; margin: 4px 0 9px; }
.nx { display: flex; gap: 10px; }
.nx-c { position: relative; display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #E4E4E4; border-radius: 10px; padding: 9px 14px 9px 9px; font-size: 13px; white-space: nowrap; }
.nx-c.pri { border: 1.5px solid var(--p-teal); font-weight: 600; }
.nx-c.hover { background: #F6FBFA; }
.nx-ic { width: 26px; height: 26px; border-radius: 7px; background: #F5F5F4; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nx-ic svg { width: 15px; height: 15px; color: #6B6B6B; }
.nx-c.pri .nx-ic { background: rgba(62,158,149,0.14); }
.nx-c.pri .nx-ic svg { color: var(--p-teal-dk); }

/* Composer */
.caret { display: inline-block; width: 1.5px; height: 15px; margin-left: 1px; vertical-align: -2px; background: var(--p-text); }
.pc-composer { position: absolute; left: 0; right: 0; bottom: 0; height: 112px; background: linear-gradient(rgba(255,255,255,0), #fff 18%); }
.pc-cw { position: absolute; left: 140px; top: 4px; width: 668px; }
.pc-box { position: relative; min-height: 72px; border: 1px solid #E2E2E2; border-radius: 14px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 13px 54px 13px 14px; font-size: 13.5px; line-height: 1.45; }
.pc-box.focus { border-color: var(--p-teal); box-shadow: 0 0 0 3px rgba(62,158,149,0.12), 0 2px 8px rgba(0,0,0,0.05); }
.pc-box .ph { color: #A3A3A3; }
.pc-send { position: absolute; right: 10px; bottom: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(62,158,149,0.5); color: #fff; display: flex; align-items: center; justify-content: center; }
.pc-send.ready { background: var(--p-teal); }
.pc-send.pressed { filter: brightness(0.85); }
.pc-send svg { width: 15px; height: 15px; stroke-width: 2.4; }
.pc-disc { text-align: center; font-size: 11px; color: var(--p-muted); margin-top: 8px; }

.lf-cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -3px 0 0 -4px; pointer-events: none; z-index: 50; filter: drop-shadow(0 2px 3px rgba(58,64,91,0.3)); }
.lf-cursor svg { position: relative; display: block; }
.lf-ripple { position: absolute; left: 4px; top: 3px; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(0,190,183,0.35); opacity: 0; }

@media (max-width: 600px) { .lf-frame { border-radius: 10px; } }
</style>

              chartSvg() + '</div>' +

          '</div></div>' +
          '<div class="pc-composer"><div class="pc-cw"><div class="pc-box" id="pc-box"><span class="ph" id="pc-ph">' + esc(FILM.placeholder) + '</span><span id="pc-typed"></span><span class="caret" id="pc-caret"></span><span class="pc-send" id="pc-send">' + I.up + '</span></div>' +

        '</section>' +
      '</main>' +
    '</div></div>' +
    '<div class="lf-cursor" id="lf-cursor"><span class="lf-ripple" id="lf-ripple"></span><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 3l14 8.2-6.3 1.5L9.6 19z" fill="#3A405B" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>';

  var el = {};
  Array.prototype.forEach.call(cam.querySelectorAll('[id]'), function (n) { el[n.id] = n; });

  function show(e, on, disp) { var d = on ? (disp || '') : 'none'; if (e.style.display !== d) e.style.display = d; }
  function cls(e, c, on) { e.classList.toggle(c, !!on); }
  function txt(e, v) { if (e.textContent !== v) e.textContent = v; }
  // Fade-up reveal that keeps its space, so layout never shifts. Nothing left behind once finished.
  function reveal(e, t, at, dur, dy) {
    var p = prog(t, at, at + (dur || 380));
    e.style.visibility = p > 0 ? '' : 'hidden';
    if (p >= 1 || p <= 0) { e.style.opacity = ''; e.style.transform = ''; return; }
    var q = eo(p);
    e.style.opacity = q.toFixed(3);
    e.style.transform = 'translateY(' + ((1 - q) * (dy == null ? 6 : dy)).toFixed(2) + 'px)';
  }
  function fade(e, t, at, dur) { var p = prog(t, at, at + (dur || 300)); e.style.visibility = p > 0 ? '' : 'hidden'; e.style.opacity = p > 0 && p < 1 ? eo(p).toFixed(3) : ''; }
  function pressedAt(t, at) { return at != null && t >= at && t < at + 180; }
  function caretOn(t) { return Math.floor(t / 530) % 2 === 0; }

  /* ── Geometry (offset based, so reveals never wobble the camera or scroll) ── */
  function offIn(e, root) { var x = 0, y = 0, n = e; while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return n === root ? { x: x, y: y, w: e.offsetWidth, h: e.offsetHeight } : null; }
  function rectIn(sel) { var e = typeof sel === 'string' ? $(sel, cam) : sel; if (!e || !e.offsetParent) return null; return offIn(e, cam); }
  function scrollAt(t) {
    var y = 0, body = el['pc-body'];
    for (var i = 0; i < SCROLL.length; i++) {
      var s = SCROLL[i]; if (t < s.at) break;
      var e = el[s.to.slice(1)], ry = 0, n = e;
      while (n && n !== el['pc-col']) { ry += n.offsetTop; n = n.offsetParent; }
      var target = Math.max(0, ry + e.offsetHeight + s.pad - body.clientHeight);
      y = y + (target - y) * ease(prog(t, s.at, s.at + s.dur));

    return y;
  }

  /* ── Scene ── */
  function renderScene(t) {
    cls(el['ps-new'], 'active', t < T.bubble);
    cls(el['ps-chat'], 'cur', t >= T.bubble);
    reveal(el['ps-chat'], t, T.bubble, 350, 0);
    var a = prog(t, T.bubble, T.bubble + 300);
    el['pm-t1'].style.opacity = (1 - a).toFixed(3); el['pm-t1'].style.visibility = a >= 1 ? 'hidden' : '';
    el['pm-t2'].style.opacity = a.toFixed(3);
    var hp = prog(t, T.send, T.send + 250);
    el['pc-hi'].style.opacity = (1 - hp).toFixed(3); el['pc-hi'].style.visibility = hp >= 1 ? 'hidden' : '';

    // Ask
    var tp = prog(t, T.typeA, T.typeB);
    var typed = t < T.bubble ? FILM.question.slice(0, Math.round(FILM.question.length * tp)) : '';
    txt(el['pc-typed'], typed);
    show(el['pc-ph'], typed === '');
    cls(el['pc-box'], 'focus', t >= T.click && t < T.bubble);
    show(el['pc-caret'], t >= T.click && t < T.bubble && ((t >= T.typeA && t < T.typeB) || caretOn(t)));
    cls(el['pc-send'], 'ready', tp > 0.05 && t < T.bubble);
    cls(el['pc-send'], 'pressed', pressedAt(t, T.send));

    el['pc-col'].style.transform = 'translateY(' + (-scrollAt(t)).toFixed(2) + 'px)';
    reveal(el['pc-u'], t, T.bubble, 360);

    // Thinking: a live timer in real seconds, steps ticking through, then it collapses
    var working = t < T.done;
    reveal(el['pc-lexi'], t, T.lexi, 360);
    el['mk-base'].setAttribute('stroke-opacity', working ? '0.22' : '1');
    el['mk-arc'].style.display = working ? '' : 'none';
    if (working) el['mk-arc'].setAttribute('transform', 'rotate(' + ((t - T.lexi) * 0.36 - 90).toFixed(1) + ' 10 10)');
    var lp = prog(t, T.done, T.done + 220);
    el['pc-tl'].style.opacity = (1 - lp).toFixed(3); el['pc-tl'].style.visibility = lp >= 1 ? 'hidden' : '';
    show(el['th'], working, 'block'); show(el['st-row'], !working, 'block');
    if (working) {
      reveal(el['th'], t, T.think, 360);
      txt(el['th-tm'], Math.min(FILM.thinkingSeconds, Math.max(0, Math.floor((t - T.think) / 1000) + 1)) + 's');
      el['th-dot'].style.opacity = (0.35 + 0.65 * (0.5 + 0.5 * Math.cos(t / 160))).toFixed(2);
      T.stepAt.forEach(function (at, i) {
        show(el['ts' + i], t >= at, 'flex'); el['ts' + i].style.opacity = t < at + 300 ? eo(prog(t, at, at + 300)).toFixed(3) : '';   // box grows a line at a time
        cls(el['ts' + i], 'cur', t >= at && (i === T.stepAt.length - 1 ? t < T.done : t < T.stepAt[i + 1]));
      });
    } else fade(el['st-row'], t, T.done, 260);

    // Answer, chart, follow-up, next steps
    reveal(el['pc-head'], t, T.head, 400);
    reveal(el['ck'], t, T.chart, 420, 10);
    el['ck-clip-r'].setAttribute('width', (CW * ease(prog(t, T.drawA, T.drawB))).toFixed(1));
    reveal(el['ck-end0'], t, T.drawB - 150, 300, 0); reveal(el['ck-end1'], t, T.drawB - 150, 300, 0);
    reveal(el['ck-call'], t, T.callout, 380, 0);
    reveal(el['pc-follow'], t, T.follow, 380);
    txt(el['pc-n'], n0(FILM.savable * ease(prog(t, T.countA, T.countB))));
    reveal(el['nx-cap'], t, T.nextCap, 340, 4);
    T.next.forEach(function (at, i) { reveal(el['nx' + i], t, at, 340, 5); });
    cls(el['nx0'], 'hover', t >= 15100);
  }

  /* ── Camera and cursor ── */
  var W = 1184, H = 680;
  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function framing(kf) {
    if ((!kf.to && !kf.rect) || REDUCE) return { k: 1, tx: 0, ty: 0 };
    var r = kf.rect || rectIn(kf.to); if (!r) return null;

    return { k: k, tx: clamp(W / 2 - k * (r.x + r.w / 2), W - k * W, 0), ty: clamp(H / 2 - k * (r.y + r.h / 2), H - k * H, 0) };
  }
  function renderCamera(t) {
    var st = { k: 1, tx: 0, ty: 0 };
    for (var i = 0; i < CAM.length; i++) {
      var kf = CAM[i]; if (t < kf.at) break;
      var e = ease(prog(t, kf.at, kf.at + kf.dur)), tg = framing(kf) || st;
      st = { k: st.k + (tg.k - st.k) * e, tx: st.tx + (tg.tx - st.tx) * e, ty: st.ty + (tg.ty - st.ty) * e };
    }
    cam.style.transform = (st.k === 1 && !st.tx && !st.ty) ? '' : 'translate(' + st.tx.toFixed(2) + 'px,' + st.ty.toFixed(2) + 'px) scale(' + st.k.toFixed(4) + ')';
  }
  var lastPts = {};
  function pointOf(sel, t, fx) {
    var key = sel + (fx || ''), e = $(sel, cam); if (!e || !e.offsetParent) return lastPts[key] || null;
    var r = offIn(e, cam); if (!r) return lastPts[key] || null;
    var dy = el['pc-col'].contains(e) ? -scrollAt(t) : 0;
    lastPts[key] = { x: r.x + (fx != null ? r.w * fx : Math.min(r.w * 0.5, 46)), y: r.y + r.h * 0.55 + dy };
    return lastPts[key];
  }
  function renderCursor(t) {
    var c = el['lf-cursor'], prev = { x: 760, y: 560 }, pos = prev, click = null;
    if (t < CURSOR[0].at - 200) { c.style.opacity = 0; return; }
    for (var i = 0; i < CURSOR.length; i++) {
      var w = CURSOR[i];
      if (t < w.at) { pos = prev; break; }
      var tg = pointOf(w.to, Math.min(t, w.at + w.dur), w.fx) || prev;
      var e = ease(prog(t, w.at, w.at + w.dur));
      pos = { x: prev.x + (tg.x - prev.x) * e, y: prev.y + (tg.y - prev.y) * e };
      if (w.click != null && t >= w.click && t < w.click + 450) click = (t - w.click) / 450;
      prev = tg;
    }
    c.style.opacity = clamp((t - CURSOR[0].at + 200) / 200, 0, 1).toFixed(2);
    c.style.transform = 'translate(' + pos.x.toFixed(1) + 'px,' + pos.y.toFixed(1) + 'px)';
    var rp = el['lf-ripple'];
    if (click == null) rp.style.opacity = 0; else { rp.style.opacity = (1 - click).toFixed(2); rp.style.transform = 'scale(' + (0.2 + 1.1 * ease(click)).toFixed(3) + ')'; }
  }

  /* ── Fit the 1184×680 canvas to the frame ── */
  var frame = $('#lf-frame'), canvas = $('#lf-canvas');
  function fit() { canvas.style.transform = 'scale(' + (frame.clientWidth / W).toFixed(5) + ')'; }
  fit();
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(frame); else window.addEventListener('resize', fit);

  /* ── Player: no visible controls. Loops; click to pause. ── */
  var P = { t: 0, playing: false, started: false, last: 0, done: false, fadeIn: false };
  function render() {
    var t = Math.min(P.t, T.total);
    renderScene(t); renderCamera(t); renderCursor(t);
    var o = 1;
    if (P.t > T.total + FILM.loopHoldMs - 450) o = 1 - prog(P.t, T.total + FILM.loopHoldMs - 450, T.total + FILM.loopHoldMs);
    if (P.fadeIn) o = Math.min(o, prog(P.t, 0, 450));
    frame.style.opacity = o >= 1 ? '' : o.toFixed(3);
  }
  function loop(now) {
    if (P.playing) {
      P.t += Math.min(now - P.last, 80);
      if (P.t >= T.total && !P.done) { P.done = true; cev('complete'); }
      if (P.t >= T.total + FILM.loopHoldMs) { P.t = 0; P.done = false; P.fadeIn = true; }
      if (P.fadeIn && P.t > 500) P.fadeIn = false;
    }
    P.last = now; render();
    requestAnimationFrame(loop);
  }
  function play() { P.playing = true; P.started = true; }
  function pause() { P.playing = false; }
  function seek(t) { P.t = clamp(t, 0, T.total); P.fadeIn = false; render(); }
  frame.addEventListener('pointerdown', function () { if (P.playing) { pause(); cev('pause'); } else { play(); cev('play'); } });

  window.LexiFilm = { seek: function (t) { P.playing = false; seek(t); }, total: T.total, play: play, pause: pause };

  /* ── Start: frame 0, autoplay once on screen. Reduced motion shows the final frame, still. ── */
  seek(0);
  requestAnimationFrame(function (now) { P.last = now; requestAnimationFrame(loop); });
  if (REDUCE) { seek(T.total); return; }
  if (/[?&]noplay\b/.test(location.search)) return;
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting && en.intersectionRatio >= 0.4 && !P.started) { play(); cev('autoplay'); io.disconnect(); } }); }, { threshold: [0, 0.4, 0.7] });
    io.observe(frame);
  } else play();
})();
