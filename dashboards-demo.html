<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexi Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<script type="text/javascript">
  (function(c,l,a,r,i,t,y){
    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
  })(window, document, "clarity", "script", "xi25pzdtd9");
</script>
<style>
/* Shell: transparent, so the product sits on the page's own background */
:root {
  --teal: #00BEB7; --dark-teal: #087680; --bright-teal: #00E2AA; --navy: #3A405B;
  --p-bg: #F4F4F3; --p-line: #E7E5E4; --p-line-2: #EFEEED; --p-text: #262A30; --p-muted: #737373;
  --p-faint: #A3A3A3; --p-teal: #3E9E95; --p-teal-dk: #2E7F78; --p-navy: #353A50;
  --p-down: #B45309; --p-down-bg: rgba(180,83,9,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; }
body { font-family: 'Rubik', system-ui, sans-serif; color: var(--navy); -webkit-font-smoothing: antialiased; }

.lf { max-width: 1040px; margin: 0 auto; }
.lf-frame { position: relative; width: 100%; aspect-ratio: 1184 / 680; overflow: hidden; border-radius: 14px; background: transparent; isolation: isolate; cursor: pointer; }
.lf-canvas { position: absolute; left: 0; top: 0; width: 1184px; height: 680px; transform-origin: 0 0; }
.lf-cam { position: absolute; left: 0; top: 0; width: 1184px; height: 680px; transform-origin: 0 0; }

.pw { position: absolute; left: 0; top: 0; width: 1184px; height: 680px; border-radius: 14px; overflow: hidden; background: var(--p-bg); border: 1px solid #E2E0DE; font-family: 'Inter', system-ui, sans-serif; color: var(--p-text); }
.pw-app { position: absolute; inset: 0; display: flex; }

/* Sidebar */
.ps { position: relative; width: 228px; flex-shrink: 0; padding: 18px 14px 14px; display: flex; flex-direction: column; }
.ps-ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.ps-ws-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--p-teal); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ps-ws-ic svg { width: 16px; height: 16px; }
.ps-ws-n { display: block; font-size: 13px; font-weight: 600; line-height: 1.25; }
.ps-ws-h { display: block; font-size: 11px; color: var(--p-muted); line-height: 1.3; }
.ps-ws > svg { margin-left: auto; width: 15px; height: 15px; color: var(--p-muted); }
.ps-nav { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }
.ps-link { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--p-text); }
.ps-link svg { width: 17px; height: 17px; color: #525252; flex-shrink: 0; }
.ps-link.active { background: #E9E9E7; }
.ps-link.pressed { background: #DEDEDB; }
.ps-new-ic { width: 20px; height: 20px; border-radius: 50%; background: var(--p-teal); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ps-new-ic svg { width: 12px; height: 12px; color: #fff !important; stroke-width: 2.6; }
.ps-cap { font-size: 11.5px; font-weight: 500; color: var(--p-muted); margin: 22px 8px 8px; }
.ps-item { font-size: 13px; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 6px; }
.ps-recent { margin-top: auto; }
.ps-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px 2px; }
.ps-av { width: 28px; height: 28px; border-radius: 7px; background: #E6E6E4; font-size: 11.5px; font-weight: 600; color: #525252; display: flex; align-items: center; justify-content: center; }
.ps-user span { font-size: 12.5px; }
.ps-user svg { margin-left: auto; width: 15px; height: 15px; color: var(--p-muted); }

/* Main card */
.pm { position: relative; flex: 1; min-width: 0; margin: 8px 8px 8px 0; background: #fff; border: 1px solid var(--p-line); border-radius: 12px; overflow: hidden; }
.pm-top { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--p-line-2); }
.pm-top svg { width: 17px; height: 17px; color: #737373; flex-shrink: 0; }
.pm-div { width: 1px; height: 18px; background: var(--p-line); }
.pm-title { position: relative; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.pm-title b { font-weight: 500; position: absolute; left: 0; top: 0; }
.pv { position: absolute; left: 0; right: 0; top: 46px; bottom: 0; }

/* Chat home */
.pc-hi { position: absolute; left: 0; right: 0; top: 150px; text-align: center; }
.pc-hi .a { font-size: 14px; color: var(--p-muted); display: flex; align-items: center; justify-content: center; gap: 7px; }
.pc-hi .a svg { width: 16px; height: 16px; }
.pc-hi .b { font-size: 22px; font-weight: 600; margin-top: 6px; letter-spacing: -0.01em; }
.pc-composer { position: absolute; left: 0; right: 0; bottom: 0; height: 112px; }
.pc-box { position: relative; width: 668px; margin: 4px auto 0; min-height: 72px; border: 1px solid #E2E2E2; border-radius: 14px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 13px 54px 13px 14px; font-size: 13.5px; line-height: 1.45; color: #A3A3A3; }
.pc-send { position: absolute; right: 10px; bottom: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(62,158,149,0.5); color: #fff; display: flex; align-items: center; justify-content: center; }
.pc-send svg { width: 15px; height: 15px; stroke-width: 2.4; }
.pc-disc { text-align: center; font-size: 11px; color: var(--p-muted); margin-top: 8px; }

/* Dashboards */
.db { position: absolute; inset: 0; padding: 22px 24px; }
.db-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.db-h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.db-sub { font-size: 13px; color: #525252; margin-top: 4px; }
.pk-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pk { position: relative; display: flex; align-items: stretch; border: 1px solid #E6E6E6; border-radius: 10px; background: #fff; }
.pk > div { padding: 6px 12px; }
.pk .vw { background: rgba(62,158,149,0.10); border-radius: 9px 0 0 9px; }
.pk .vs { display: flex; align-items: center; padding: 0 9px; font-size: 11px; color: var(--p-muted); border-left: 1px solid #E6E6E6; border-right: 1px solid #E6E6E6; }
.pk .cmp { width: 204px; border-radius: 0 9px 9px 0; }
.pk .cmp.open { box-shadow: inset 0 0 0 1.5px #8FCFC8; }
.pk .cmp.pressed { background: #F3F3F2; }
.pk-l { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--p-muted); }
.pk .vw .pk-l { color: var(--p-teal-dk); }
.pk-v { position: relative; display: block; font-size: 12.5px; font-weight: 500; white-space: nowrap; height: 18px; }
.pk .cmp .pk-v > span { position: absolute; left: 0; top: 0; }
.pk-v .ch { display: inline-flex; align-items: center; gap: 4px; }
.pk-v .ch svg { width: 11px; height: 11px; color: var(--p-muted); }
.pk-ref { font-size: 11px; color: var(--p-muted); }
.pk-menu { position: absolute; right: 0; top: calc(100% + 6px); width: 262px; z-index: 6; background: #fff; border: 1px solid #E2E2E2; border-radius: 10px; box-shadow: 0 14px 32px -16px rgba(38,42,48,0.3); padding: 5px; }
.pk-o { display: flex; justify-content: space-between; gap: 8px; padding: 7px 9px; border-radius: 7px; font-size: 12.5px; white-space: nowrap; }
.pk-o span { font-size: 11px; color: var(--p-muted); }
.pk-o.cur { background: #F5F5F5; }
.pk-o.hl { background: rgba(62,158,149,0.10); color: var(--p-teal-dk); font-weight: 500; }

.db-tabs { display: flex; gap: 22px; border-bottom: 1px solid #EFEFEF; margin-bottom: 16px; }
.db-tab { font-size: 13px; padding: 8px 0; margin-bottom: -1px; color: var(--p-faint); border-bottom: 2px solid transparent; }
.db-tab.on { color: var(--p-text); font-weight: 600; border-bottom-color: var(--p-text); }

.kp { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
.k { position: relative; border: 1px solid #E6E6E6; border-radius: 12px; padding: 12px 14px; min-width: 0; height: 102px; background: #fff; }
.k.hover { border-color: #8FCFC8; box-shadow: 0 0 0 2px rgba(62,158,149,0.12); }
.k-l { font-size: 12px; color: var(--p-muted); white-space: nowrap; }
.k-v { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; margin: 5px 0 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-d { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--p-muted); white-space: nowrap; height: 20px; }
.pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.up { background: rgba(0,226,170,0.18); color: var(--p-teal-dk); }
.pill.down { background: var(--p-down-bg); color: var(--p-down); }
.pill svg { width: 10px; height: 10px; stroke-width: 2.6; }
.k-ask { position: absolute; right: 10px; bottom: 11px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--p-teal); color: #fff; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.k-ask svg { width: 12px; height: 12px; }
.k-ask.pressed { filter: brightness(0.86); }

.cs { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 10px; }
.c { position: relative; border: 1px solid #E6E6E6; border-radius: 12px; padding: 12px 14px 10px; min-width: 0; background: #fff; }
.c-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 26px; }
.c-t { font-size: 13px; font-weight: 600; }
.c-x { display: flex; align-items: center; gap: 4px; }
.c-ib { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--p-muted); }
.c-ib svg { width: 15px; height: 15px; }
.c-ib.on { background: #F0F0EF; color: var(--p-text); }
.c-ib.pressed { background: #E6E6E4; }
.c-svg { display: block; margin-top: 6px; }
.c-lg { display: flex; justify-content: center; gap: 16px; font-size: 11px; color: var(--p-muted); margin-top: 4px; height: 16px; }
.c-lg span { display: inline-flex; align-items: center; gap: 6px; }
.c-lg i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--p-teal); }
.c-lg i.dash { background: repeating-linear-gradient(90deg, #A3A3A3 0 4px, transparent 4px 7px); }
.c-lg i.grey { background: #D6D3D1; height: 8px; width: 10px; border-radius: 2px; }
.ex { position: absolute; right: 12px; top: 42px; width: 220px; z-index: 6; background: #fff; border: 1px solid #E2E2E2; border-radius: 10px; box-shadow: 0 14px 32px -16px rgba(38,42,48,0.3); padding: 5px; }
.ex-o { position: relative; display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 7px; font-size: 12.5px; white-space: nowrap; height: 34px; }
.ex-o svg { width: 14px; height: 14px; color: var(--p-muted); flex-shrink: 0; }
.ex-o .s { margin-left: auto; font-size: 11px; color: var(--p-muted); }
.ex-o.hl { background: rgba(62,158,149,0.10); }
.ex-o .done { position: absolute; inset: 0; display: flex; align-items: center; gap: 9px; padding: 0 9px; border-radius: 7px; background: #DDF6EE; color: var(--p-teal-dk); font-weight: 600; }
.ex-o .done svg { color: var(--p-teal-dk); }

/* Ask Lexi panel */
.ap { position: absolute; top: 0; right: 0; bottom: 0; width: 404px; z-index: 8; display: none; flex-direction: column; background: #fff; border-left: 1px solid var(--p-line); box-shadow: -22px 0 44px -34px rgba(38,42,48,0.5); }
.ap-h { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--p-line-2); flex-shrink: 0; }
.ap-h > svg { width: 18px; height: 18px; flex-shrink: 0; }
.ap-t { font-size: 13.5px; font-weight: 600; flex: 1; }
.ap-x { width: 15px; height: 15px; color: var(--p-muted); }
.ap-b { position: relative; flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px; }
.ap-ctx { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--p-muted); background: #F5F5F5; border: 1px solid #E6E6E6; border-radius: 999px; padding: 3px 10px; margin-bottom: 12px; white-space: nowrap; }
.ap-ctx svg { width: 12px; height: 12px; }
.ap-ctx b { font-weight: 600; color: var(--p-text); }
.ap-u { display: flex; justify-content: flex-end; margin-bottom: 12px; }
.ap-bub { max-width: 330px; background: #fff; border: 1px solid #E4E4E4; border-radius: 14px; padding: 9px 14px; font-size: 13.5px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
.ap-lx { display: flex; align-items: center; height: 20px; margin-bottom: 8px; }
.ap-lx svg { width: 18px; height: 18px; display: block; }
.ap-st { display: flex; align-items: center; gap: 8px; border: 1px solid #E4E4E4; border-radius: 8px; padding: 6px 11px; height: 30px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; color: var(--p-teal-dk); margin-bottom: 10px; }
.ap-st i { width: 6px; height: 6px; border-radius: 50%; background: #34D399; }
.ap-st svg { margin-left: auto; width: 13px; height: 13px; color: #737373; }
.ap-p { font-size: 13.5px; line-height: 1.55; margin-bottom: 12px; }
.ap-p b { font-weight: 600; }
.ap-tb { border: 1px solid #E6E6E6; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.ap-r { display: grid; grid-template-columns: minmax(0,1fr) 70px 70px 56px; gap: 8px; align-items: center; height: 38px; padding: 0 12px; border-top: 1px solid #F1F1F1; font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ap-r.h { border-top: none; background: #FAFAFA; height: 32px; font-size: 11.5px; font-weight: 600; color: var(--p-muted); }
.ap-r > span:nth-child(n+2) { text-align: right; }
.ap-r .now { font-weight: 600; }
.ap-r .pill { justify-self: end; }
.ap-nx { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--p-teal); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.ap-nx span.ic { width: 22px; height: 22px; border-radius: 6px; background: rgba(62,158,149,0.12); color: var(--p-teal-dk); display: flex; align-items: center; justify-content: center; }
.ap-nx span.ic svg { width: 13px; height: 13px; }

.lf-cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -3px 0 0 -4px; pointer-events: none; z-index: 50; filter: drop-shadow(0 2px 3px rgba(58,64,91,0.3)); }
.lf-cursor svg { position: relative; display: block; }
.lf-ripple { position: absolute; left: 4px; top: 3px; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(0,190,183,0.35); opacity: 0; }

@media (max-width: 600px) { .lf-frame { border-radius: 10px; } }
</style>
</head>
<body>

<div class="lf" id="lf">
  <div class="lf-frame" id="lf-frame" role="img" aria-label="Animated walkthrough: opening Lexi dashboards, comparing last week with the week before, exporting a chart for slides, and asking Lexi why average order value dropped">
    <div class="lf-canvas" id="lf-canvas"><div class="lf-cam" id="lf-cam"></div></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   LEXI DASHBOARDS: WEBSITE EMBED FOR /platform/reporting (Oct 2026)
   "Watch a dashboard answer the next question". Beats: open Dashboards,
   compare last week with the week before, export a chart for slides, ask
   Lexi why average order value dropped.
   Product only: no player, captions or cards. Loops; a click pauses it.
   All copy and data live in FILM. Edit there.
   ══════════════════════════════════════════════════════════════════════════ */
var FILM = {
  id: 'lexi-dashboards-web',
  loopHoldMs: 2400,                    // pause on the final frame before the film loops
  workspace: { name: 'Fitness Co', handle: 'fitness-co' },
  user: { initials: 'ST', name: 'Sam Taylor' },
  pinned: ['Improving Customer Retention'],
  recent: ['Lapsing VIP Members Segment', 'Winter Range Sell-Through', 'Full-Price Loyalists Review', 'Second Order Conversion', 'Store Performance by Region'],
  greeting: 'How can I help you today?',
  placeholder: 'Try: Analyse my best customers in the last 30 days',

  page: { title: 'Dashboards', sub: 'Sales and segment performance on your resolved customers.', refreshed: 'Refreshed 2 hours ago' },
  tabs: ['Sales performance', 'Segment performance'],
  viewing: ['Viewing', 'Last week · 19 to 25 Oct'],
  compareLabel: 'Compared to',
  compareNone: 'None',
  compareOptions: [
    // label, dates (first option is the one the cursor picks)
    ['Previous week', '12 to 18 Oct'],
    ['Same week last year', '20 to 26 Oct 2025'],
    ['Black Friday last year', '28 Nov to 1 Dec']
  ],
  // label, value now, value before, format ('$k' money, 'n' count, '$' money, '%' percent), delta text, direction
  kpis: [
    ['Revenue', 1280192, 1254100, '$m', '+2.1%', 'up'],
    ['Orders', 9640, 8877, 'n', '+8.6%', 'up'],
    ['Avg order value', 132.80, 141.30, '$', '−6.0%', 'down'],
    ['New customer %', 18.4, 19.6, '%', '−1.2 pts', 'down']
  ],
  askOn: 2,                            // which KPI card the cursor asks about
  revenueChart: {
    title: 'Revenue over time',
    days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
    now: [168, 174, 159, 181, 192, 214, 192],      // $k per day, last week
    before: [171, 165, 170, 176, 183, 200, 189],   // $k per day, the week before
    min: 140, max: 230
  },
  channelChart: {
    title: 'Orders by channel',
    rows: [['Online', 4210, 3720], ['Stores', 5430, 5157]],
    max: 6000
  },
  exportOptions: [['Download CSV', 'Data'], ['Download PNG', 'For slides']],
  exportDone: 'Revenue over time.png',

  // Ask Lexi why
  askButton: 'Ask Lexi why',
  askTitle: 'Ask Lexi',
  askContext: 'Avg order value, last week',
  askPrompt: 'Why did average spend drop last week?',
  askSteps: 3,
  askAnswer: 'Average order value fell <b>6%</b> because customers bought fewer items per order. Price per item went up, so it’s basket size, not discounting. Most of the drop is in footwear orders.',
  askTable: {
    head: ['', 'Before', 'Last week', ''],
    rows: [
      // label, before, now, format, change, direction
      ['Items per order', 2.40, 2.10, 'x', '−0.3', 'down'],
      ['Price per item', 58.90, 63.20, '$', '+7%', 'up']
    ]
  },
  askNext: 'Build a segment of single-item footwear buyers'
};

(function () {
  'use strict';

  /* ── Timeline (ms). Every frame is a pure function of t. ── */
  var T = {
    navClick: 1200, view: 1300, kpis: 1400, countA: 1500, countB: 2500, lineA: 1700, lineB: 2900,
    cmpClick: 3900, menu: 4000, optClick: 4800, cmp: 5000, cmpLineB: 6200, deltas: 5300,
    expClick: 8100, exMenu: 8200, pngClick: 8900, exOut: 9750,
    hover: 10300, askBtn: 10400, askClick: 11100, panel: 11200,
    bubble: 11800, stepsA: 12100, stepsB: 13400, ans: 13500, rows: [13900, 14150], rowA: 14100, rowB: 14900, next: 15200,
    total: 17600
  };
  var CURSOR = [
    { at: 300, dur: 850, to: '#ps-dash', click: T.navClick },
    { at: 3000, dur: 850, to: '#pk-cmp', click: T.cmpClick },
    { at: 4150, dur: 600, to: '#pk-o0', click: T.optClick },
    { at: 7100, dur: 950, to: '#ch-exp', fx: 0.5, click: T.expClick },
    { at: 8300, dur: 550, to: '#ex-o1', click: T.pngClick },
    { at: 9600, dur: 700, to: '#k' + FILM.askOn, fx: 0.42, click: null },   // hover the card
    { at: 10500, dur: 550, to: '#k-ask', fx: 0.5, click: T.askClick },
    { at: 12000, dur: 900, to: '#ap-b', fx: 0.97, click: null }
  ];
  var CAM = [
    // One push in, then the camera holds: picker, KPIs, the chart's download menu and the Lexi panel all sit in this framing
    { at: 2900, dur: 1000, rect: { x: 800, y: 66, w: 376, h: 220 }, k: 1.2 }
  ];

  /* ── Helpers ── */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function ease(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

    reveal(el['ap-st'], t, T.stepsA, 340);
    var n = Math.max(1, Math.round(FILM.askSteps * prog(t, T.stepsA, T.stepsB)));
    txt(el['ap-stt'], n + (n === 1 ? ' STEP' : ' STEPS'));
    el['ap-dot'].style.opacity = tracing ? (0.35 + 0.65 * (0.5 + 0.5 * Math.cos(t / 160))).toFixed(2) : '';
    reveal(el['ap-p'], t, T.ans, 400);
    reveal(el['ap-tb'], t, T.rows[0] - 150, 380, 6);
    AT.rows.forEach(function (r, i) {
      reveal(el['ar' + i], t, T.rows[i], 320, 4);
      var v = r[1] + (r[2] - r[1]) * ease(prog(t, T.rowA + i * 150, T.rowB + i * 150));
      txt(el['an' + i], r[3] === '$' ? '$' + v.toFixed(2) : v.toFixed(1));
      fade(el['ap' + i], t, T.rowB + i * 150 - 100, T.rowB + i * 150 + 200);
    });
    reveal(el['ap-nx'], t, T.next, 380, 4);
  }

  /* ── Camera and cursor ── */
  var W = 1184, H = 680;
  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function framing(kf) {
    if (!kf.rect || REDUCE) return { k: 1, tx: 0, ty: 0 };
    var r = kf.rect, k = Math.max(1, Math.min(kf.k || 1.5, W * 0.92 / r.w, H * 0.92 / r.h));
    return { k: k, tx: clamp(W / 2 - k * (r.x + r.w / 2), W - k * W, 0), ty: clamp(H / 2 - k * (r.y + r.h / 2), H - k * H, 0) };
  }
  function renderCamera(t) {
    var st = { k: 1, tx: 0, ty: 0 };
    for (var i = 0; i < CAM.length; i++) {
      var kf = CAM[i]; if (t < kf.at) break;
      var e = ease(prog(t, kf.at, kf.at + kf.dur)), tg = framing(kf);
      st = { k: st.k + (tg.k - st.k) * e, tx: st.tx + (tg.tx - st.tx) * e, ty: st.ty + (tg.ty - st.ty) * e };
    }
    cam.style.transform = (st.k === 1 && !st.tx && !st.ty) ? '' : 'translate(' + st.tx.toFixed(2) + 'px,' + st.ty.toFixed(2) + 'px) scale(' + st.k.toFixed(4) + ')';
  }
  function offIn(e, root) { var x = 0, y = 0, n = e; while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return n === root ? { x: x, y: y, w: e.offsetWidth, h: e.offsetHeight } : null; }
  // Targets are measured as they sit at rest (menus and panels included), so the cursor lands true
  var restPts = {};
  function pointOf(sel, fx) {
    var key = sel + (fx || '');
    if (restPts[key]) return restPts[key];
    var e = $(sel, cam); if (!e) return null;
    var hidden = [], n = e;
    while (n && n !== cam) { if (n.style && n.style.display === 'none') { hidden.push([n, n.style.display]); n.style.display = n.classList.contains('ap') ? 'flex' : 'block'; } n = n.parentNode; }
    var tr = [];
    n = e; while (n && n !== cam) { if (n.style && n.style.transform) { tr.push([n, n.style.transform]); n.style.transform = ''; } n = n.parentNode; }
    var r = offIn(e, cam);
    hidden.forEach(function (h) { h[0].style.display = h[1]; });
    tr.forEach(function (h) { h[0].style.transform = h[1]; });
    if (!r || !r.w) return null;
    restPts[key] = { x: r.x + (fx != null ? r.w * fx : Math.min(r.w * 0.5, 46)), y: r.y + r.h * 0.55 };
    return restPts[key];
  }
  function renderCursor(t) {
    var c = el['lf-cursor'], prev = { x: 760, y: 560 }, pos = prev, click = null;
    if (t < CURSOR[0].at - 200) { c.style.opacity = 0; return; }
    for (var i = 0; i < CURSOR.length; i++) {
      var w = CURSOR[i];
      if (t < w.at) { pos = prev; break; }
      var tg = pointOf(w.to, w.fx) || prev;
      var e = ease(prog(t, w.at, w.at + w.dur));
      pos = { x: prev.x + (tg.x - prev.x) * e, y: prev.y + (tg.y - prev.y) * e };
      if (w.click != null && t >= w.click && t < w.click + 450) click = (t - w.click) / 450;
      prev = tg;
    }
    c.style.opacity = clamp((t - CURSOR[0].at + 200) / 200, 0, 1).toFixed(2);
    c.style.transform = 'translate(' + pos.x.toFixed(1) + 'px,' + pos.y.toFixed(1) + 'px)';
    var rp = el['lf-ripple'];
    if (click == null) rp.style.opacity = 0; else { rp.style.opacity = (1 - click).toFixed(2); rp.style.transform = 'scale(' + (0.2 + 1.1 * ease(click)).toFixed(3) + ')'; }
  }

  /* ── Fit the 1184×680 canvas to the frame ── */
  var frame = $('#lf-frame'), canvas = $('#lf-canvas');
  function fit() { canvas.style.transform = 'scale(' + (frame.clientWidth / W).toFixed(5) + ')'; restPts = {}; }
  fit();
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(frame); else window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { restPts = {}; });

  /* ── Player: no visible controls. Loops; click to pause. ── */
  var P = { t: 0, playing: false, started: false, last: 0, done: false, fadeIn: false };
  function render() {
    var t = Math.min(P.t, T.total);
    renderScene(t); renderCamera(t); renderCursor(t);
    var o = 1;
    if (P.t > T.total + FILM.loopHoldMs - 450) o = 1 - prog(P.t, T.total + FILM.loopHoldMs - 450, T.total + FILM.loopHoldMs);
    if (P.fadeIn) o = Math.min(o, prog(P.t, 0, 450));
    frame.style.opacity = o >= 1 ? '' : o.toFixed(3);
  }
  function loop(now) {
    if (P.playing) {
      P.t += Math.min(now - P.last, 80);
      if (P.t >= T.total && !P.done) { P.done = true; cev('complete'); }
      if (P.t >= T.total + FILM.loopHoldMs) { P.t = 0; P.done = false; P.fadeIn = true; }
      if (P.fadeIn && P.t > 500) P.fadeIn = false;
    }
    P.last = now; render();
    requestAnimationFrame(loop);
  }
  function play() { P.playing = true; P.started = true; }
  function pause() { P.playing = false; }
  function seek(t) { P.t = clamp(t, 0, T.total); P.fadeIn = false; render(); }
  frame.addEventListener('pointerdown', function () { if (P.playing) { pause(); cev('pause'); } else { play(); cev('play'); } });

  window.LexiFilm = { seek: function (t) { P.playing = false; seek(t); }, total: T.total, play: play, pause: pause };

  /* ── Start: frame 0, autoplay once on screen. Reduced motion shows the final frame, still. ── */
  seek(0);
  requestAnimationFrame(function (now) { P.last = now; requestAnimationFrame(loop); });
  if (REDUCE) { seek(T.total); return; }
  if (/[?&]noplay\b/.test(location.search)) return;
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting && en.intersectionRatio >= 0.4 && !P.started) { play(); cev('autoplay'); io.disconnect(); } }); }, { threshold: [0, 0.4, 0.7] });
    io.observe(frame);
  } else play();
})();
</script>
</body>
