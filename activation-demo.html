<style>
/* Shell: transparent, so the product sits on the page's own background */
:root {
  --teal: #00BEB7; --dark-teal: #087680; --bright-teal: #00E2AA; --navy: #3A405B;
  --p-bg: #F4F4F3; --p-line: #E7E5E4; --p-line-2: #EFEEED; --p-text: #262A30; --p-muted: #737373;
  --p-faint: #A3A3A3; --p-teal: #3E9E95; --p-teal-dk: #2E7F78; --p-navy: #353A50;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; }
body { font-family: 'Rubik', system-ui, sans-serif; color: var(--navy); -webkit-font-smoothing: antialiased; }

.lf { max-width: 1040px; margin: 0 auto; }
.lf-frame { position: relative; width: 100%; aspect-ratio: 1184 / 680; overflow: hidden; border-radius: 14px; background: transparent; isolation: isolate; cursor: pointer; }

.pw { position: absolute; left: 0; top: 0; width: 1184px; height: 680px; border-radius: 14px; overflow: hidden; background: var(--p-bg); border: 1px solid #E2E0DE; font-family: 'Inter', system-ui, sans-serif; color: var(--p-text); }
.pw-app { position: absolute; inset: 0; display: flex; }

/* Sidebar */
.ps { position: relative; width: 228px; flex-shrink: 0; padding: 18px 14px 14px; display: flex; flex-direction: column; }
.ps-ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.ps-ws-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--p-teal); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ps-ws-ic svg { width: 16px; height: 16px; }
.ps-ws-n { display: block; font-size: 13px; font-weight: 600; line-height: 1.25; }
.ps-ws-h { display: block; font-size: 11px; color: var(--p-muted); line-height: 1.3; }
.ps-ws > svg { margin-left: auto; width: 15px; height: 15px; color: var(--p-muted); }
.ps-nav { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }

.ps-link svg { width: 17px; height: 17px; color: #525252; flex-shrink: 0; }

.ps-new-ic { width: 20px; height: 20px; border-radius: 50%; background: var(--p-teal); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ps-new-ic svg { width: 12px; height: 12px; color: #fff !important; stroke-width: 2.6; }
.ps-cap { font-size: 11.5px; font-weight: 500; color: var(--p-muted); margin: 22px 8px 8px; }

.ps-item.cur { background: #E9E9E7; }
.ps-recent { margin-top: auto; }
.ps-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px 2px; }
.ps-av { width: 28px; height: 28px; border-radius: 7px; background: #E6E6E4; font-size: 11.5px; font-weight: 600; color: #525252; display: flex; align-items: center; justify-content: center; }
.ps-user span { font-size: 12.5px; }
.ps-user svg { margin-left: auto; width: 15px; height: 15px; color: var(--p-muted); }

/* Main card */
.pm { position: relative; flex: 1; min-width: 0; margin: 8px 8px 8px 0; background: #fff; border: 1px solid var(--p-line); border-radius: 12px; overflow: hidden; }
.pm-top { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--p-line-2); }
.pm-top svg { width: 17px; height: 17px; color: #737373; flex-shrink: 0; }
.pm-div { width: 1px; height: 18px; background: var(--p-line); }
.pm-title { position: relative; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.pm-title b { font-weight: 500; position: absolute; left: 0; top: 0; }
.pv { position: absolute; left: 0; right: 0; top: 46px; bottom: 0; }

/* Chat */

.pc-col { position: relative; width: 640px; margin: 0 auto; padding: 22px 0 18px; }
.pc-user { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.pc-bubble { max-width: 500px; background: #fff; border: 1px solid #E4E4E4; border-radius: 14px; padding: 11px 16px; font-size: 14.5px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }

.pc-old svg { width: 16px; height: 16px; color: #737373; flex-shrink: 0; }

.pc-old .ok svg { width: 12px; height: 12px; color: var(--p-teal-dk); }

.ak { border: 1px solid #E6E6E6; border-radius: 10px; overflow: hidden; margin-bottom: 14px; background: #fff; }
.ak-h { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-bottom: 1px solid #EFEFEF; font-size: 13px; font-weight: 600; }

.ak-v { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }

.ak-v .m { color: var(--p-muted); white-space: nowrap; }
.ak-reach { flex: 1; min-width: 0; }
.ak-rt { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
.ak-rn { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 52px; }
.ak-rl { color: var(--p-muted); }
.ak-rp { margin-left: auto; font-weight: 600; color: var(--p-teal-dk); font-variant-numeric: tabular-nums; }
.ak-bar { height: 6px; border-radius: 999px; background: #EFEFEF; overflow: hidden; margin-top: 6px; }
.ak-bar i { display: block; height: 100%; width: 0; background: var(--p-teal); border-radius: 999px; }
.ak-f { display: grid; border-top: 1px solid #EFEFEF; margin-top: 4px; }
.ak-f > div { grid-area: 1 / 1; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
.ak-fine { font-size: 11.5px; color: var(--p-muted); margin-left: 4px; }
.ak-sync { flex-direction: column; align-items: stretch !important; gap: 0 !important; }
.ak-pc { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--p-muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.ak-pc b { font-weight: 600; color: var(--p-text); }

.pbtn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 6px; background: var(--p-teal); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid var(--p-teal); }
.pbtn svg { width: 14px; height: 14px; }

.lg { display: inline-flex; align-items: center; line-height: 1; }

.pc-box { position: relative; width: 668px; margin: 4px auto 0; min-height: 72px; border: 1px solid #E2E2E2; border-radius: 14px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 13px 54px 13px 14px; font-size: 13.5px; line-height: 1.45; }

.ac-live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--p-teal-dk); background: rgba(0,226,170,0.18); padding: 4px 10px; border-radius: 999px; }
.ac-live i { width: 6px; height: 6px; border-radius: 50%; background: var(--p-teal-dk); }

.hl { position: absolute; inset: 0; background: rgba(0,190,183,0.10); pointer-events: none; opacity: 0; }

.lf-cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -3px 0 0 -4px; pointer-events: none; z-index: 50; filter: drop-shadow(0 2px 3px rgba(58,64,91,0.3)); }

@media (max-width: 600px) { .lf-frame { border-radius: 10px; } }

            '<div class="pc-lexi" id="pc-lexi" aria-label="Lexi"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.6" fill="none" stroke="#FF329D" stroke-width="2.8" id="pc-mark-base"/><circle cx="10" cy="10" r="7.6" fill="none" stroke="#FF329D" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="14 34" id="pc-mark-arc" transform="rotate(-90 10 10)"/></svg></div>' +
            '<div class="pc-steps" id="pc-steps"><i id="pc-dot"></i><span id="pc-steps-t"></span>' + I.chev + '</div>' +
            '<p class="pc-p" id="pc-intro">' + FILM.intro + '</p>' +
            '<div class="ak" id="ak">' +
              '<div class="ak-h">' + I.radio + '<span>New activation</span><span class="sp"></span>' +
                '<span class="st draft" id="st-a">Draft</span><span class="st sync" id="st-b">' + I.refresh + 'Syncing</span><span class="st live" id="st-c"><i></i>Live</span></div>' +
              '<div class="ak-b">' +
                '<div class="ak-row" id="ak-r0"><span class="ak-l">Segment</span><span class="ak-v"><b>' + esc(S.name) + '</b><span class="m">' + n0(S.count) + ' customers</span></span></div>' +
                '<div class="ak-row" id="ak-r1"><span class="ak-l">Destination</span><span class="ak-v">' + logo(15) + '<span class="m">' + esc(A.list) + '</span></span></div>' +
                '<div class="ak-row" id="ak-r2"><span class="ak-l">Reachable</span><span class="ak-reach"><span class="ak-rt"><span class="ak-rn" id="ak-rn">0</span><span class="ak-rl">matched on ' + esc(A.matchedOn) + '</span><span class="ak-rp" id="ak-rp">0%</span></span><span class="ak-bar" style="display:block"><i id="ak-bar"></i></span></span></div>' +
                '<div class="ak-row" id="ak-r3"><span class="ak-l">Sync</span><span class="ak-v"><b>' + esc(A.frequency) + '</b><span class="m">' + esc(A.freqNote) + '</span></span></div>' +
              '</div>' +
              '<div class="ak-f" id="ak-foot">' +
                '<div id="ak-ask"><span class="pbtn" id="ak-go">' + I.send + 'Send to Klaviyo</span><span class="pbtn ghost">Edit</span><span class="ak-fine">' + esc(FILM.fine) + '</span></div>' +
                '<div class="ak-sync" id="ak-sync"><span class="ak-bar" style="display:block;margin-top:2px"><i id="ak-pb"></i></span><span class="ak-pc"><span><b id="ak-pn">0</b> of ' + n0(A.matched) + ' profiles sent to Klaviyo</span><span id="ak-pt">Syncing</span></span></div>' +
              '</div>' +
            '</div>' +
            '<p class="pc-p" id="pc-done">' + FILM.done + '</p>' +
          '</div></div>' +
          '<div class="pc-composer"><div class="pc-box" id="pc-box"><span class="ph" id="pc-ph">' + esc(FILM.placeholder) + '</span><span id="pc-typed"></span><span class="caret" id="pc-caret"></span><span class="pc-send" id="pc-send">' + I.up + '</span></div>' +
          '<div class="pc-disc">Lexi is AI and can make mistakes. Verify important information.</div></div>' +
        '</section>' +
        // Activations
        '<section class="pv" id="pv-act"><div class="ac">' +
          '<div class="sg-head" id="ac-head"><div><div class="sg-h1">Activations</div><div class="sg-sub">Segments sent to your channels, kept in sync.</div></div><span class="pbtn">' + I.plus + 'New activation</span></div>' +
          '<div id="ac-zoom"><div class="sg-tabs" id="ac-tabs"><span class="sg-tab on">All (' + (FILM.otherActivations.length + 1) + ')</span><span class="sg-tab">Live</span><span class="sg-tab">Sent</span></div>' +
          '<div class="sg-table"><div class="ac-row h"><div>Activation</div><div>Destination</div><div class="ac-r">Reached</div><div class="ac-r">Status</div></div>' +
            '<div class="ac-row" id="ac-row0"><span class="hl" id="ac-hl"></span><div style="min-width:0;position:relative"><div class="sg-n">' + esc(A.name) + '<span class="ac-new">New</span></div><div class="sg-d">From segment: ' + esc(S.name) + ', syncs daily</div></div>' +
              '<div style="position:relative">' + logo(13) + '</div>' +
              '<div class="ac-r" style="position:relative"><div class="sg-p">' + n0(A.matched) + '</div><div class="sg-a">Synced just now</div></div>' +
              '<div class="ac-r" style="position:relative"><span class="ac-live"><i></i>Live</span></div></div>' +
            FILM.otherActivations.map(actRow).join('') +
          '</div></div>' +
        '</div></section>' +
      '</main>' +
    '</div></div>' +
    '<div class="lf-cursor" id="lf-cursor"><span class="lf-ripple" id="lf-ripple"></span><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 3l14 8.2-6.3 1.5L9.6 19z" fill="#3A405B" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>';

  var el = {};
  Array.prototype.forEach.call(cam.querySelectorAll('[id]'), function (n) { el[n.id] = n; });
  var actRows = [0, 1, 2, 3].map(function (i) { return el['ac-row' + i]; });

  function show(e, on, disp) { var d = on ? (disp || '') : 'none'; if (e.style.display !== d) e.style.display = d; }
  function cls(e, c, on) { e.classList.toggle(c, !!on); }
  function txt(e, v) { if (e.textContent !== v) e.textContent = v; }
  // Fade-up reveal that keeps its space, so the layout never shifts. Nothing left behind once finished.
  function reveal(e, t, at, dur, dy) {
    var p = prog(t, at, at + (dur || 380));
    e.style.visibility = p > 0 ? '' : 'hidden';
    if (p >= 1 || p <= 0) { e.style.opacity = ''; e.style.transform = ''; return; }
    var q = eo(p);
    e.style.opacity = q.toFixed(3);
    e.style.transform = 'translateY(' + ((1 - q) * (dy == null ? 6 : dy)).toFixed(2) + 'px)';
  }
  function fade(e, t, a, b) { var p = prog(t, a, b); e.style.visibility = p > 0 ? '' : 'hidden'; e.style.opacity = p >= 1 ? '' : eo(p).toFixed(3); }
  function pressedAt(t, at) { return at != null && t >= at && t < at + 180; }
  function caretOn(t) { return Math.floor(t / 530) % 2 === 0; }
  function pct(e, v) { var w = v.toFixed(2) + '%'; if (e.style.width !== w) e.style.width = w; }

  /* ── Geometry (offset based, so reveals never wobble the camera or scroll) ── */
  function offIn(e, root) { var x = 0, y = 0, n = e; while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return n === root ? { x: x, y: y, w: e.offsetWidth, h: e.offsetHeight } : null; }
  function rectIn(sel) { var e = typeof sel === 'string' ? $(sel, cam) : sel; if (!e || !e.offsetParent) return null; return offIn(e, cam); }
  function scrollAt(t) {
    var y = 0, body = el['pc-body'];
    for (var i = 0; i < SCROLL.length; i++) {
      var s = SCROLL[i]; if (t < s.at) break;
      var e = el[s.to.slice(1)], r = { y: 0, h: e.offsetHeight }, n = e;
      while (n && n !== el['pc-col']) { r.y += n.offsetTop; n = n.offsetParent; }
      var target = Math.max(0, r.y + r.h + s.pad - body.clientHeight);
      y = y + (target - y) * ease(prog(t, s.at, s.at + s.dur));
    }
    return y;
  }

  /* ── Scene ── */
  function renderScene(t) {
    var actView = t >= T.view;
    show(el['pv-chat'], !actView); show(el['pv-act'], actView);
    cls(el['ps-chat'], 'cur', !actView);
    cls(el['ps-acts'], 'active', actView);
    cls(el['ps-acts'], 'pressed', pressedAt(t, T.navClick));
    var tp = prog(t, T.view, T.view + 300);
    el['pm-t1'].style.opacity = (1 - tp).toFixed(3); el['pm-t2'].style.opacity = tp.toFixed(3);
    el['pm-t1'].style.visibility = tp >= 1 ? 'hidden' : '';

    if (!actView) {
      // Composer
      var typing = t >= T.typeA && t < T.typeB, tp2 = prog(t, T.typeA, T.typeB);
      var typed = t < T.bubble ? FILM.prompt.slice(0, Math.round(FILM.prompt.length * tp2)) : '';
      txt(el['pc-typed'], typed);
      show(el['pc-ph'], typed === '');
      cls(el['pc-box'], 'focus', t >= T.inputClick && t < T.bubble);
      show(el['pc-caret'], t >= T.inputClick && t < T.bubble && (typing || caretOn(t)));
      cls(el['pc-send'], 'ready', tp2 > 0.05 && t < T.bubble);
      cls(el['pc-send'], 'pressed', pressedAt(t, T.sendClick));

      // Thread
      el['pc-col'].style.transform = 'translateY(' + (-scrollAt(t)).toFixed(2) + 'px)';
      reveal(el['pc-user'], t, T.bubble, 360);
      reveal(el['pc-lexi'], t, T.lexi, 360);
      var tracing = t < T.stepsB;
      el['pc-mark-base'].setAttribute('stroke-opacity', tracing ? '0.22' : '1');
      el['pc-mark-arc'].style.display = tracing ? '' : 'none';
      if (tracing) el['pc-mark-arc'].setAttribute('transform', 'rotate(' + ((t - T.lexi) * 0.36 - 90).toFixed(1) + ' 10 10)');
      reveal(el['pc-steps'], t, T.stepsA, 360);
      var n = Math.max(1, Math.round(FILM.steps * prog(t, T.stepsA, T.stepsB)));
      txt(el['pc-steps-t'], n + (n === 1 ? ' STEP' : ' STEPS'));
      el['pc-dot'].style.opacity = t < T.stepsB ? (0.35 + 0.65 * (0.5 + 0.5 * Math.cos(t / 160))).toFixed(2) : '';
      reveal(el['pc-intro'], t, T.intro, 380);
      reveal(el['ak'], t, T.card, 420, 10);
      T.rows.forEach(function (a, i) { reveal(el['ak-r' + i], t, a, 340, 5); });
      var c = A.matched * ease(prog(t, T.countA, T.countB));
      txt(el['ak-rn'], n0(c)); txt(el['ak-rp'], Math.round(c / S.count * 100) + '%');
      pct(el['ak-bar'], c / S.count * 100);

      // Approve, sync, live
      var sending = t >= T.sendAct + 120;
      reveal(el['ak-foot'], t, T.foot, 360, 4);
      fade(el['ak-ask'], t, T.foot, T.foot + 360);
      if (sending) { var op = 1 - prog(t, T.sendAct + 120, T.sendAct + 300); el['ak-ask'].style.opacity = op.toFixed(3); el['ak-ask'].style.visibility = op > 0 ? '' : 'hidden'; }
      cls(el['ak-go'], 'pressed', pressedAt(t, T.sendAct));
      fade(el['ak-sync'], t, T.sendAct + 220, T.sendAct + 500);
      var sp = ease(prog(t, T.syncA, T.live - 100));
      pct(el['ak-pb'], sp * 100); txt(el['ak-pn'], n0(A.matched * sp));
      txt(el['ak-pt'], t >= T.live ? 'Live, next sync tomorrow 6:00am' : 'Syncing');
      show(el['st-a'], !sending, 'inline-flex');
      show(el['st-b'], sending && t < T.live, 'inline-flex');
      show(el['st-c'], t >= T.live, 'inline-flex');
      el['st-b'].querySelector('svg').style.transform = sending && t < T.live ? 'rotate(' + ((t - T.sendAct) * 0.4).toFixed(1) + 'deg)' : '';
      reveal(el['pc-done'], t, T.done, 400);
    } else {
      reveal(el['ac-head'], t, T.view, 300, 0); reveal(el['ac-tabs'], t, T.view + 60, 300, 0);
      actRows.forEach(function (r, i) { reveal(r, t, T.actRows + i * 90, 340, 6); });
      var hp = prog(t, T.actRows + 300, T.actRows + 800);   // the new row stays lit through the end hold
      el['ac-hl'].style.opacity = ease(hp).toFixed(3);
    }
  }

  /* ── Camera and cursor ── */
  var W = 1184, H = 680;
  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function framing(kf) {
    if ((!kf.to && !kf.rect) || REDUCE) return { k: 1, tx: 0, ty: 0 };
    var r = kf.rect || rectIn(kf.to); if (!r) return null;
    var k = Math.max(1, Math.min(kf.k || 1.5, W * 0.92 / r.w, H * 0.92 / r.h));
    return { k: k, tx: clamp(W / 2 - k * (r.x + r.w / 2), W - k * W, 0), ty: clamp(H / 2 - k * (r.y + r.h / 2), H - k * H, 0) };
  }
  function renderCamera(t) {
    var st = { k: 1, tx: 0, ty: 0 };
    for (var i = 0; i < CAM.length; i++) {
      var kf = CAM[i]; if (t < kf.at) break;
      var e = ease(prog(t, kf.at, kf.at + kf.dur)), tg = framing(kf) || st;
      st = { k: st.k + (tg.k - st.k) * e, tx: st.tx + (tg.tx - st.tx) * e, ty: st.ty + (tg.ty - st.ty) * e };
    }
    cam.style.transform = (st.k === 1 && !st.tx && !st.ty) ? '' : 'translate(' + st.tx.toFixed(2) + 'px,' + st.ty.toFixed(2) + 'px) scale(' + st.k.toFixed(4) + ')';
  }
  var lastPts = {};
  function pointOf(sel, t, fx) {
    var key = sel + (fx || ''), e = $(sel, cam); if (!e || !e.offsetParent) return lastPts[key] || null;
    var r = offIn(e, cam); if (!r) return lastPts[key] || null;
    // Targets inside the chat thread move with its scroll
    var dy = el['pc-col'].contains(e) ? -scrollAt(t) : 0;
    lastPts[key] = { x: r.x + (fx != null ? r.w * fx : Math.min(r.w * 0.5, 46)), y: r.y + r.h * 0.55 + dy };
    return lastPts[key];
  }
  function renderCursor(t) {
    var c = el['lf-cursor'], prev = { x: 760, y: 560 }, pos = prev, click = null;
    if (t < CURSOR[0].at - 200) { c.style.opacity = 0; return; }
    for (var i = 0; i < CURSOR.length; i++) {
      var w = CURSOR[i];
      if (t < w.at) { pos = prev; break; }
      var tg = pointOf(w.to, Math.min(t, w.at + w.dur), w.fx) || prev;
      var e = ease(prog(t, w.at, w.at + w.dur));
      pos = { x: prev.x + (tg.x - prev.x) * e, y: prev.y + (tg.y - prev.y) * e };
      if (w.click != null && t >= w.click && t < w.click + 450) click = (t - w.click) / 450;
      prev = tg;
    }
    c.style.opacity = clamp((t - CURSOR[0].at + 200) / 200, 0, 1).toFixed(2);
    c.style.transform = 'translate(' + pos.x.toFixed(1) + 'px,' + pos.y.toFixed(1) + 'px)';
    var rp = el['lf-ripple'];
    if (click == null) rp.style.opacity = 0; else { rp.style.opacity = (1 - click).toFixed(2); rp.style.transform = 'scale(' + (0.2 + 1.1 * ease(click)).toFixed(3) + ')'; }
  }

  /* ── Fit the 1184×680 canvas to the frame ── */
  var frame = $('#lf-frame'), canvas = $('#lf-canvas');
  function fit() { canvas.style.transform = 'scale(' + (frame.clientWidth / W).toFixed(5) + ')'; }
  fit();
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(frame); else window.addEventListener('resize', fit);

  /* ── Player: no visible controls. Loops; click to pause. ── */
  var P = { t: 0, playing: false, started: false, last: 0, done: false, fadeIn: false };
  function render() {
    var t = Math.min(P.t, T.total);
    renderScene(t); renderCamera(t); renderCursor(t);
    var o = 1;
    if (P.t > T.total + FILM.loopHoldMs - 450) o = 1 - prog(P.t, T.total + FILM.loopHoldMs - 450, T.total + FILM.loopHoldMs);
    if (P.fadeIn) o = Math.min(o, prog(P.t, 0, 450));
    frame.style.opacity = o >= 1 ? '' : o.toFixed(3);
  }
  function loop(now) {
    if (P.playing) {
      P.t += Math.min(now - P.last, 80);
      if (P.t >= T.total && !P.done) { P.done = true; cev('complete'); }
      if (P.t >= T.total + FILM.loopHoldMs) { P.t = 0; P.done = false; P.fadeIn = true; }
      if (P.fadeIn && P.t > 500) P.fadeIn = false;
    }
    P.last = now; render();
    requestAnimationFrame(loop);
  }
  function play() { P.playing = true; P.started = true; }
  function pause() { P.playing = false; }
  function seek(t) { P.t = clamp(t, 0, T.total); P.fadeIn = false; render(); }
  frame.addEventListener('pointerdown', function () { if (P.playing) { pause(); cev('pause'); } else { play(); cev('play'); } });

  window.LexiFilm = { seek: function (t) { P.playing = false; seek(t); }, total: T.total, play: play, pause: pause };

  /* ── Start: frame 0, autoplay once on screen. Reduced motion shows the final frame, still. ── */
  seek(0);
  requestAnimationFrame(function (now) { P.last = now; requestAnimationFrame(loop); });
  if (REDUCE) { seek(T.total); return; }
  if (/[?&]noplay\b/.test(location.search)) return;
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting && en.intersectionRatio >= 0.4 && !P.started) { play(); cev('autoplay'); io.disconnect(); } }); }, { threshold: [0, 0.4, 0.7] });
    io.observe(frame);
  } else play();
})();
</script>
